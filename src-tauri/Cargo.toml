[package]
name = "typst-equation-clipboard"
version = "0.1.0"
description = "Copy Typst equations to presentation slides"
authors = ["Typst Equation Clipboard contributors"]
edition = "2021"

[lib]
name = "typst_equation_clipboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
wait-timeout = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory"
] }
